<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>USJET brand export capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #020617;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .export-surface {
        display: inline-block;
        margin: 1rem;
        padding: 1.25rem;
        background: #020617;
        vertical-align: top;
      }
      .export-surface--hero-wordmark {
        padding: 2rem 2.5rem;
      }
      .gaming-vr-icon--hero {
        width: 120px;
        height: 72px;
        color: #22d3ee;
      }
      .gaming-vr-icon--nav {
        width: 48px;
        height: 28px;
        color: #22d3ee;
      }
      .gaming-vr-icon--badge {
        width: 64px;
        height: 38px;
        color: #c084fc;
      }
      .zelle-capture {
        color: #6d1ed9;
        width: 84px;
        height: 28px;
      }
      .fleet-cap-capture .fleet-cap-badges {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="export-surface" data-export-id="wordmark-nav">
      <span class="usjet-logo-stone usjet-logo-stone--nav usjet-logo-stone--glow"
        >USJET<span class="usjet-logo-stone__ai">.AI</span></span
      >
    </div>

    <div class="export-surface export-surface--hero-wordmark" data-export-id="wordmark-hero">
      <span class="usjet-logo-stone usjet-logo-stone--hero usjet-logo-stone--glow"
        >USJET<span class="usjet-logo-stone__ai">.AI</span></span
      >
    </div>

    <div class="export-surface" data-export-id="btn-glass">
      <button type="button" class="btn-glass">Launch bay</button>
    </div>

    <div class="export-surface" data-export-id="btn-glass-prominent">
      <button type="button" class="btn-glass-prominent">Fuel the fleet</button>
    </div>

    <div class="export-surface" data-export-id="member-prime-badge-locked">
      <div class="usjet-prime-badge">
        <p class="usjet-prime-badge__label">Member ID Status</p>
        <p class="usjet-prime-badge__status usjet-prime-badge__status--locked">ACCESS LOCKED</p>
      </div>
    </div>

    <div class="export-surface" data-export-id="member-prime-badge-active">
      <div class="usjet-prime-badge">
        <p class="usjet-prime-badge__label">Member ID Status</p>
        <p class="usjet-prime-badge__status usjet-prime-badge__status--active">USJET-PRIME-ACTIVE</p>
        <p class="usjet-prime-badge__id">cus_SOVEREIGN_SAMPLE</p>
      </div>
    </div>

    <div class="export-surface fleet-cap-capture" data-export-id="fleet-cap-badges-both-web">
      <div class="fleet-cap-badges" aria-hidden="true">
        <span class="fleet-cap-badge">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="fleet-cap-badge__icon" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01"/></svg>
          <span>Type</span>
        </span>
        <span class="fleet-cap-badge">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="fleet-cap-badge__icon" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1"/><path d="M12 19v3"/></svg>
          <span>Voice</span>
        </span>
        <span class="fleet-cap-badge fleet-cap-badge--platform">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="fleet-cap-badge__icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Web</span>
        </span>
      </div>
    </div>

    <div class="export-surface" data-export-id="gaming-founder-key-emblem">
      <div class="gaming-founder-key" aria-hidden="true">
        <div class="gaming-founder-key__stage">
          <div class="gaming-founder-key__star">
            <svg viewBox="0 0 120 120" fill="none" class="gaming-founder-key__star-svg">
              <defs>
                <linearGradient id="gaming-key-star-grad-export" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fae8ff" />
                  <stop offset="45%" stop-color="#c084fc" />
                  <stop offset="100%" stop-color="#7c3aed" />
                </linearGradient>
              </defs>
              <path
                fill="url(#gaming-key-star-grad-export)"
                stroke="rgba(250, 250, 250, 0.35)"
                stroke-width="1.2"
                d="M60 8l14.2 40.4h42.5L81.4 74.6l14.2 40.4L60 88.7 24.4 115l14.2-40.4L3.3 48.4h42.5L60 8z"
              />
            </svg>
          </div>
          <div class="gaming-founder-key__shaft"></div>
          <div class="gaming-founder-key__bow"></div>
        </div>
        <span class="gaming-founder-key__label">Entry key</span>
      </div>
    </div>

    <div class="export-surface" data-export-id="gaming-vr-icon-hero">
      <svg class="gaming-vr-icon gaming-vr-icon--hero" viewBox="0 0 120 72" fill="none" aria-hidden="true">
        <path d="M18 28 L18 44 Q18 52 26 54 L54 54 L60 62 L60 54 L88 54 Q96 52 96 44 L96 28 Q96 18 86 16 L34 16 Q24 18 24 28 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
        <rect x="52" y="8" width="12" height="6" rx="2" fill="currentColor" />
        <rect x="8" y="30" width="6" height="12" rx="2" fill="currentColor" />
        <rect x="106" y="30" width="6" height="12" rx="2" fill="currentColor" />
        <text x="57" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="currentColor">VR</text>
      </svg>
    </div>

    <div class="export-surface zelle-capture" data-export-id="zelle-logo-mark">
      <svg viewBox="0 0 56 18" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zelle">
        <text x="0" y="14" fill="currentColor" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Zelle</text>
      </svg>
    </div>
  </body>
</html>
